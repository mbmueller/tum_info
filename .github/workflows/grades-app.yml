name: Build Grades App

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: Grades
          - os: windows-latest
            asset: Grades.exe
          - os: macos-latest
            asset: Grades.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📂 setup
        uses: actions/checkout@v7

      - name: 🐍 setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 📦 install dependencies
        run: pip install requests PySide6 pyinstaller

      - name: 🔨 build app
        run: pyinstaller --noconfirm scripts/course_glob_ui.spec

      - name: 🍏 package macos
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          bash scripts/course_glob_ui_build.sh

      - name: 🚀 upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: 🏷️ attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.asset }}
